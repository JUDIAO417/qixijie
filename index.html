<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>浪漫星河相册</title>
    <style>
        /* 基础样式重置与防触控 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1a0b1c 0%, #3d1b38 50%, #5e294f 100%);
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }

        /* 背景画布（星空与爱心特效） */
        #bg-canvas, #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        #fx-canvas {
            z-index: 999;
        }

        /* 顶部与底部固定信息 */
        .fixed-ui {
            position: absolute;
            z-index: 100;
            text-shadow: 0 0 8px rgba(255, 182, 193, 0.8);
        }
        .top-left {
            top: 20px;
            left: 20px;
            font-size: 16px;
        }
        .top-left a {
            color: #ffb6c1;
            text-decoration: none;
            display: inline-block;
            padding: 6px 12px;
            border: 1px solid rgba(255, 182, 193, 0.5);
            border-radius: 15px;
            background: rgba(255, 105, 180, 0.15);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
            transition: transform 0.2s;
        }
        .top-left a:active {
            transform: scale(0.95);
        }
        .bottom-center {
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffd1dc;
        }

        /* 照片墙弹窗 (Gallery Overlay) */
        #gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 11, 28, 0.95);
            backdrop-filter: blur(15px);
            z-index: 900; /* 低于大图预览，高于背景 */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            overflow-y: auto;
            padding: 20px;
            padding-top: 80px; /* 留出顶部空间 */
            padding-bottom: 50px;
        }
        #gallery-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .gallery-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 105, 180, 0.2);
            border: 2px solid rgba(255, 182, 193, 0.8);
            border-radius: 50%;
            color: #fff;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 901;
            box-shadow: 0 0 10px #ff69b4;
            backdrop-filter: blur(4px);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .gallery-grid img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gallery-grid img:active {
            transform: scale(0.95);
        }
        .gallery-title {
            text-align: center;
            color: #ffb6c1;
            font-size: 20px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ffb6c1;
        }

        /* 开场遮罩弹窗 */
        #welcome-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 11, 28, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.8s ease;
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
            animation: float 3s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 280px;
        }
        .welcome-card h1 {
            font-size: 24px;
            color: #ffb6c1;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ffb6c1;
        }
        .welcome-btn {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 15px #ff69b4;
            cursor: pointer;
            outline: none;
            transition: transform 0.2s;
        }
        .welcome-btn:active {
            transform: scale(0.95);
        }

        /* 进度条样式 */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #ffb6c1);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
        }

        /* 漂浮照片容器 */
        #album-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            overflow: hidden;
            pointer-events: none;
        }
        .photo-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 160px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 182, 193, 0.6);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
            padding: 4px;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform;
            backdrop-filter: blur(2px);
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            pointer-events: none;
        }

        /* 大图查看器 */
        #lightbox {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 15px;
            border: 3px solid rgba(255, 182, 193, 0.8);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .lb-tip {
            position: absolute;
            bottom: 15%;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
        }

        /* 背景音乐按钮 */
        #bgm-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.2);
            border: 2px solid #ffb6c1;
            box-shadow: 0 0 12px #ff69b4;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }
        .spin {
            animation: spin 3s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 顶部左侧按钮 (已修改为全部照片) -->
    <div class="fixed-ui top-left" id="ui-top-left">
        <a href="#" id="ui-link"></a>
    </div>
    <div class="fixed-ui bottom-center" id="ui-bottom"></div>

    <canvas id="bg-canvas"></canvas>
    <div id="album-container"></div>
    <canvas id="fx-canvas"></canvas>

    <div id="bgm-btn" class="spin">🎵</div>
    <audio id="bgm-audio" loop preload="auto"></audio>

    <!-- 照片墙网格弹窗 -->
    <div id="gallery-overlay">
        <div class="gallery-close" id="gallery-close">×</div>
        <div class="gallery-title">✨ 时光长河 ✨</div>
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <!-- 大图查看器 -->
    <div id="lightbox">
        <img id="lb-img" src="" alt="大图" />
        <div class="lb-tip">滑动切换 · 点击空白关闭</div>
    </div>

    <!-- 开场弹窗 -->
    <div id="welcome-overlay">
        <div class="welcome-card">
            <h1>七夕|星河</h1>
            <p style="font-size: 14px; color: #ffb6c1; margin-bottom: 20px;" id="welcome-tip">     </p>
            <button class="welcome-btn" id="enter-btn">开启相册</button>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </div>

<script>
/**
 * ==========================================
 * 全局配置区
 * ==========================================
 */
const CONFIG = {
    github: {
        user: 'JUDIAO417',    // 你的 GitHub 用户名
        repo: 'qixijie',      // 你的仓库名
        branch: 'main',       // 分支名
        path: 'yl'            // 照片文件夹路径
    },
    fallbackImages: [
        'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=400&q=80',
        'https://images.unsplash.com/photo-1494774157365-9e04c6720e47?auto=format&fit=crop&w=400&q=80',
        'https://images.unsplash.com/photo-1518049362265-d5b2a6467637?auto=format&fit=crop&w=400&q=80',
        'https://images.unsplash.com/photo-1522031128362-e61295b9d375?auto=format&fit=crop&w=400&q=80'
    ],
    bgmUrl: 'https://cdn.jsdelivr.net/gh/JUDIAO417/qixijie@main/yy/bgm.mp3', 
    texts: {
        topLeft: '❤️ 全部照片', // 文案已修改
        topLeftLink: '#',
        bottom: '🌌 遇见你，是浩瀚星河里最浪漫的奇迹 🌌'
    }
};

let allImages = [];
let uniqueImages = []; // 用于存放去重后的照片，供给照片墙使用
let isPaused = false; 
let photoObjects = []; 
const TOTAL_PHOTOS = 16;
let cooldownMap = new Map(); 

document.getElementById('ui-link').innerText = CONFIG.texts.topLeft;
document.getElementById('ui-link').href = CONFIG.texts.topLeftLink;
document.getElementById('ui-bottom').innerText = CONFIG.texts.bottom;
document.getElementById('bgm-audio').src = CONFIG.bgmUrl;

const progressBar = document.getElementById('progress-bar');
const welcomeTip = document.getElementById('welcome-tip');
const galleryOverlay = document.getElementById('gallery-overlay');
const galleryGrid = document.getElementById('gallery-grid');
const galleryClose = document.getElementById('gallery-close');
const uiLink = document.getElementById('ui-link');

/**
 * ==========================================
 * 核心逻辑一：带进度条的预加载算法
 * ==========================================
 */
async function loadImages() {
    allImages = [];
    let low = 1;
    let high = 500; 
    let maxCount = 0;
    
    let step = 0;
    const maxSteps = 9; 

    welcomeTip.innerText = '正在计算星河轨迹 (其实是加载嘻嘻)...';

    while (low <= high) {
        step++;
        let percent = Math.min((step / maxSteps) * 60, 60);
        progressBar.style.width = percent + '%';

        let mid = Math.floor((low + high) / 2);
        let testUrl = `https://raw.githubusercontent.com/${CONFIG.github.user}/${CONFIG.github.repo}/${CONFIG.github.branch}/${CONFIG.github.path}/${mid}.jpg`;
        
        try {
            let res = await fetch(testUrl, { method: 'HEAD' });
            if (res.ok) {
                maxCount = mid; 
                low = mid + 1;  
            } else {
                high = mid - 1; 
            }
        } catch (e) {
            high = mid - 1;
        }
    }

    if (maxCount === 0) {
        allImages = CONFIG.fallbackImages;
    } else {
        for (let i = 1; i <= maxCount; i++) {
            allImages.push(`https://cdn.jsdelivr.net/gh/${CONFIG.github.user}/${CONFIG.github.repo}@${CONFIG.github.branch}/${CONFIG.github.path}/${i}.jpg`);
        }
    }

    // 保存一份不重复的照片数组给照片墙用
    uniqueImages = [...allImages];

    while (allImages.length < TOTAL_PHOTOS && allImages.length > 0) {
        allImages = allImages.concat(allImages);
    }

    welcomeTip.innerText = '正在点亮浪漫星光 (预加载照片)...';
    progressBar.style.width = '65%';

    let preloadCount = Math.min(allImages.length, TOTAL_PHOTOS);
    let loadedCount = 0;

    await new Promise((resolve) => {
        if(preloadCount === 0) resolve();
        for(let i = 0; i < preloadCount; i++) {
            const img = new Image();
            img.src = allImages[i];
            
            img.onload = img.onerror = () => {
                loadedCount++;
                let p = 65 + (loadedCount / preloadCount) * 35;
                progressBar.style.width = p + '%';
                
                if(loadedCount === preloadCount) {
                    resolve();
                }
            };
        }
    });

    progressBar.style.width = '100%';
    welcomeTip.innerText = '加载完成！';
}

function getNextImageIndex() {
    const now = Date.now();
    for (let [idx, time] of cooldownMap.entries()) {
        if (now - time > 8000) {
            cooldownMap.delete(idx);
        }
    }
    let pool = allImages.map((_, i) => i).filter(i => !cooldownMap.has(i));
    
    if (pool.length < Math.max(1, allImages.length / 2)) {
        pool = allImages.map((_, i) => i);
    }
    
    const pickedIdx = pool[Math.floor(Math.random() * pool.length)];
    cooldownMap.set(pickedIdx, now);
    return pickedIdx;
}

/**
 * ==========================================
 * 核心逻辑二：照片墙 (Gallery)
 * ==========================================
 */
uiLink.addEventListener('click', (e) => {
    e.preventDefault();
    
    // 渲染网格照片
    galleryGrid.innerHTML = '';
    uniqueImages.forEach((src) => {
        const img = document.createElement('img');
        img.src = src;
        // 点击照片墙里的图，直接打开放大查看器
        img.addEventListener('click', () => {
            // 在 allImages 中找到索引，传给大图查看器
            openLightbox(allImages.indexOf(src));
        });
        galleryGrid.appendChild(img);
    });

    galleryOverlay.classList.add('active');
    isPaused = true; // 打开照片墙时暂停背景动画
});

galleryClose.addEventListener('click', () => {
    galleryOverlay.classList.remove('active');
    // 关闭时恢复背景动画
    isPaused = false;
});


/**
 * ==========================================
 * 以下为动画、大图查看器等常规逻辑
 * ==========================================
 */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let stars = [];

function initStars() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            r: Math.random() * 1.5 + 0.5,
            alpha: Math.random(),
            speed: (Math.random() - 0.5) * 0.02
        });
    }
}

function drawStars() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    bgCtx.fillStyle = '#fff';
    stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha <= 0 || s.alpha >= 1) s.speed = -s.speed;
        bgCtx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        bgCtx.fill();
    });
    requestAnimationFrame(drawStars);
}

window.addEventListener('resize', initStars);
initStars();
drawStars();

const container = document.getElementById('album-container');

function createPhotoCard(idx) {
    const el = document.createElement('div');
    el.className = 'photo-card';
    const img = document.createElement('img');
    img.src = allImages[idx];
    
    img.onerror = function() {
        this.src = CONFIG.fallbackImages[0];
    };

    el.appendChild(img);
    container.appendChild(el);
    
    el.addEventListener('click', () => openLightbox(idx));
    
    return {
        el,
        imgNode: img,
        x: Math.random() * window.innerWidth,
        y: -200 - Math.random() * 500,
        speedY: Math.random() * 1.0 + 0.8,
        rot: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 1.5,
        imgIdx: idx
    };
}

function initAlbum() {
    for (let i = 0; i < TOTAL_PHOTOS; i++) {
        const idx = getNextImageIndex();
        photoObjects.push(createPhotoCard(idx));
    }
    animateAlbum();
}

function animateAlbum() {
    if (!isPaused) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        photoObjects.forEach(p => {
            p.y += p.speedY;
            p.rot += p.rotSpeed;
            if (p.y > h + 50) {
                p.y = -200;
                p.x = Math.random() * w;
                p.speedY = Math.random() * 1.0 + 0.8;
                p.rotSpeed = (Math.random() - 0.5) * 1.5;
                p.imgIdx = getNextImageIndex();
                p.imgNode.src = allImages[p.imgIdx];
            }
            p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotateZ(${p.rot}deg)`;
        });
    }
    requestAnimationFrame(animateAlbum);
}

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
let currentLbIndex = 0;
let touchStartX = 0;

function openLightbox(idx) {
    currentLbIndex = idx;
    lbImg.src = allImages[idx];
    lightbox.classList.add('active');
    isPaused = true;
}

// 优化：从大图关闭时，如果网格墙没开，才恢复背景动画
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox || e.target.classList.contains('lb-tip')) {
        lightbox.classList.remove('active');
        if (!galleryOverlay.classList.contains('active')) {
            isPaused = false;
        }
    }
});

lightbox.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
});
lightbox.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].clientX;
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) > 50) {
        if (diff > 0) {
            currentLbIndex = (currentLbIndex - 1 + allImages.length) % allImages.length;
        } else {
            currentLbIndex = (currentLbIndex + 1) % allImages.length;
        }
        lbImg.style.transform = 'scale(0.95)';
        setTimeout(() => {
            lbImg.src = allImages[currentLbIndex];
            lbImg.style.transform = 'scale(1)';
        }, 150);
    }
});

const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let hearts = [];
const audio = document.getElementById('bgm-audio');

function resizeFxCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeFxCanvas);
resizeFxCanvas();

function createHeartParticles(x, y) {
    for (let i = 0; i < 40; i++) {
        hearts.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15,
            life: 1.0,
            decay: Math.random() * 0.02 + 0.015,
            scale: Math.random() * 1.5 + 0.5
        });
    }
}

function drawHearts() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = hearts.length - 1; i >= 0; i--) {
        let p = hearts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        
        if (p.life <= 0) {
            hearts.splice(i, 1);
            continue;
        }
        
        fxCtx.save();
        fxCtx.translate(p.x, p.y);
        fxCtx.scale(p.scale * p.life, p.scale * p.life);
        fxCtx.globalAlpha = p.life;
        fxCtx.fillStyle = '#ff69b4';
        
        fxCtx.beginPath();
        fxCtx.moveTo(0, 0);
        fxCtx.bezierCurveTo(-5, -5, -10, 5, 0, 15);
        fxCtx.bezierCurveTo(10, 5, 5, -5, 0, 0);
        fxCtx.fill();
        fxCtx.restore();
    }
    requestAnimationFrame(drawHearts);
}
drawHearts();

window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        const x = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        createHeartParticles(x, y);
        
        const originalVol = audio.volume;
        audio.volume = 1.0;
        setTimeout(() => {
            let vol = 1.0;
            let fade = setInterval(() => {
                vol -= 0.05;
                if(vol <= originalVol) {
                    audio.volume = originalVol;
                    clearInterval(fade);
                } else {
                    audio.volume = vol;
                }
            }, 100);
        }, 3000);
    }
});

const enterBtn = document.getElementById('enter-btn');
const welcomeOverlay = document.getElementById('welcome-overlay');
const progressContainer = document.getElementById('progress-container');
const bgmBtn = document.getElementById('bgm-btn');

function requestFullScreen() {
    const el = document.documentElement;
    if(el.requestFullscreen) { el.requestFullscreen(); }
    else if(el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
}

enterBtn.addEventListener('click', async () => {
    enterBtn.style.display = 'none';
    progressContainer.style.display = 'block';

    audio.volume = 0.5;
    audio.play().catch(e => console.log("浏览器限制自动播放"));

    await loadImages();

    setTimeout(() => {
        welcomeOverlay.style.opacity = '0';
        setTimeout(() => { welcomeOverlay.style.display = 'none'; }, 800);
        
        try { requestFullScreen(); } catch(e){}
        initAlbum();
    }, 500);
});

bgmBtn.addEventListener('click', () => {
    if (audio.paused) {
        audio.play();
        bgmBtn.classList.add('spin');
    } else {
        audio.pause();
        bgmBtn.classList.remove('spin');
    }
});
</script>
</body>
</html>

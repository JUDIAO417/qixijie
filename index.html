<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕致我们</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #2c2436 0%, #4b3858 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        /* 静态星光背景 */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bg-star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        /* 流星雨照片容器 */
        #meteors-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .meteor-photo {
            position: absolute;
            will-change: transform, opacity;
            pointer-events: auto;
            cursor: pointer;
            border-radius: 16px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 20px rgba(255, 182, 193, 0.2);
            backdrop-filter: blur(3px);
            transition: transform 0.3s ease;
            opacity: 0;
        }

        .meteor-photo img {
            display: block;
            width: 95px; 
            height: auto;
            border-radius: 13px;
            object-fit: cover;
            pointer-events: none;
        }

        .meteor-photo.paused {
            animation-play-state: paused !important;
            opacity: 1 !important;
        }

        /* 底部告白文案 */
        .footer-quote {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.6);
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* 全屏引导蒙层与按钮 */
        #fullscreen-tip {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 36, 54, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(8px);
        }

        .tip-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 85%;
        }

        .tip-card h2 {
            font-size: 18px;
            color: #ffccd5;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .tip-card p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .enter-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            border-radius: 30px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 117, 140, 0.4);
            animation: pulseBtn 2s infinite ease-in-out;
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 5px 20px rgba(255, 117, 140, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 5px 25px rgba(255, 117, 140, 0.7); }
        }

        /* 左上角可点击跳转的链接样式 */
        .top-corner-link {
            position: fixed;
            top: 10px;
            left: 15px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            z-index: 10;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .top-corner-link:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* 音乐悬浮部件 */
        .music-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .music-btn.playing {
            animation: rotateVinyl 4s linear infinite;
        }

        @keyframes rotateVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-btn svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        /* 弹窗看图 */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 15, 25, 0.95);
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-image {
            max-width: 92%;
            max-height: 85vh;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 5px 30px rgba(0,0,0,0.6);
        }

        .modal-tip {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            pointer-events: none;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <div class="starfield" id="starfield"></div>
    <canvas id="particle-canvas"></canvas>
    
    <a href="https://www.qixijieaini.top/admin.html" class="top-corner-link" target="_blank">七夕致我们</a>

    <div id="meteors-container"></div>
    <div class="footer-quote">愿我们岁岁年年，共赏浩瀚星河。</div>

    <div class="music-btn" id="music-btn" title="音乐开关">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>

    <div id="fullscreen-tip">
        <div class="tip-card">
            <h2>✨-七夕相册-✨</h2>
            <p>点击下方按钮进入</p>
            <button class="enter-btn" id="enter-btn">开启相册</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content-wrapper" id="modal-wrapper">
            <img class="modal-image" id="modal-img" src="" alt="Photo">
            <div class="modal-tip">左滑/右滑切换 · 点击空白关闭</div>
        </div>
    </div>

    <!-- 使用绝对 CDN 链接加载 BGM，100% 稳定出声 -->
    <audio id="bgm" src="https://fastly.jsdelivr.net/gh/JUDIAO417/qixijie@main/yy/bgm.mp3" loop preload="auto"></audio>

    <script>
        const GITHUB_USER = "JUDIAO417";
        const REPO_NAME = "qixijie";

        let photoUrls = [];
        const VISIBLE_COUNT = 16; 
        const DURATION_MIN = 12;
        const DURATION_MAX = 18;
        
        const photoCooldownMap = {}; 
        const COOLDOWN_TIME = 20 * 1000;

        const meteorsContainer = document.getElementById('meteors-container');
        const styleSheet = document.styleSheets[0];
        const photoPool = [];

        // 星空背景初始化
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 45; i++) {
            const star = document.createElement('div');
            star.className = 'bg-star';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            const size = Math.random() * 1.5 + 0.5 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.animationDelay = Math.random() * 3 + 's';
            starfield.appendChild(star);
        }

        async function fetchPhotosFromGitHub() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/yl?t=${Date.now()}`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    photoUrls = data
                        .filter(item => /\.(jpg|jpeg|png|webp)$/i.test(item.name))
                        .sort((a, b) => {
                            let numA = parseInt(a.name) || 0;
                            let numB = parseInt(b.name) || 0;
                            return numA - numB;
                        })
                        .map(item => `https://fastly.jsdelivr.net/gh/${GITHUB_USER}/${REPO_NAME}@main/yl/${item.name}`);
                }
            } catch (err) {
                console.log("API fetch failed");
            }

            // 绝对保底：如果 API 没开或者读不到，自动用 CDN 链接加载 1 到 120 张
            if (photoUrls.length === 0) {
                for (let i = 1; i <= 120; i++) {
                    photoUrls.push(`https://fastly.jsdelivr.net/gh/${GITHUB_USER}/${REPO_NAME}@main/yl/${i}.jpg`);
                }
            }

            initMeteorRain();
        }

        fetchPhotosFromGitHub();

        let currentModalIndex = 0;

        function initMeteorRain() {
            if (window.isMeteorInitialized) return;
            window.isMeteorInitialized = true;

            for (let i = 0; i < VISIBLE_COUNT; i++) {
                const item = document.createElement('div');
                item.className = 'meteor-photo';
                const img = document.createElement('img');
                img.loading = 'lazy';
                item.appendChild(img);
                item.addEventListener('contextmenu', e => e.preventDefault());
                
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const currentUrl = img.getAttribute('data-src');
                    const realIndex = photoUrls.indexOf(currentUrl);
                    openModal(realIndex !== -1 ? realIndex : 0);
                });

                meteorsContainer.appendChild(item);
                photoPool.push(item);
            }

            photoPool.forEach((item, index) => {
                const delay = (index * (DURATION_MAX / VISIBLE_COUNT) * 0.6) * 1000;
                setTimeout(() => {
                    assignNextSmartPhoto(item, true);
                }, delay);

                item.addEventListener('animationend', (e) => {
                    if (e.animationName.startsWith('meteorMove_')) {
                        assignNextSmartPhoto(item, false);
                    }
                });
            });
        }

        function assignNextSmartPhoto(item, isInitial) {
            const now = Date.now();
            let availablePhotos = photoUrls.filter(url => {
                const lastTime = photoCooldownMap[url] || 0;
                return (now - lastTime) > COOLDOWN_TIME;
            });

            if (availablePhotos.length === 0) {
                availablePhotos = photoUrls;
            }

            const randomUrl = availablePhotos[Math.floor(Math.random() * availablePhotos.length)];
            photoCooldownMap[randomUrl] = Date.now();

            assignAndAnimate(item, randomUrl, isInitial);
        }

        function assignAndAnimate(item, url, isInitial) {
            const img = item.querySelector('img');
            img.src = url;
            img.setAttribute('data-src', url);

            item.style.animation = 'none';
            void item.offsetWidth;

            const duration = Math.random() * (DURATION_MAX - DURATION_MIN) + DURATION_MIN;
            const startX = Math.random() * 95 - 5; 
            const startY = isInitial ? (Math.random() * 80 - 10) : (-30 - Math.random() * 10);
            const endX = startX + (Math.random() * 30 - 15);
            const endY = 115;
            const rotate = Math.random() * 14 - 7;

            const animName = `meteorMove_${Math.random().toString(36).substr(2, 9)}`;
            const keyframes = `
                @keyframes ${animName} {
                    0% { transform: translate(${startX}vw, ${startY}vh) rotate(${rotate}deg); opacity: ${isInitial ? 1 : 0}; }
                    15% { opacity: 1; }
                    85% { opacity: 1; }
                    100% { transform: translate(${endX}vw, ${endY}vh) rotate(${rotate + 4}deg); opacity: 0; }
                }
            `;
            styleSheet.insertRule(keyframes, styleSheet.cssRules.length);
            
            const activeDuration = isInitial ? (duration * (Math.random() * 0.5 + 0.5)) : duration;
            item.style.animation = `${animName} ${activeDuration}s linear infinite`;
        }

        // 弹窗逻辑（点击看对应的高清原图 zp/）
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        function openModal(index) {
            currentModalIndex = index;
            // 自动将预览图链接转换为高清原图的 CDN 链接
            let highResUrl = photoUrls[index].replace('/yl/', '/zp/');
            modalImg.src = highResUrl;
            modal.classList.add('active');
            document.querySelectorAll('.meteor-photo').forEach(el => el.classList.add('paused'));
        }

        function closeModal() {
            modal.classList.remove('active');
            document.querySelectorAll('.meteor-photo').forEach(el => el.classList.remove('paused'));
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal || e.target.id === 'modal-wrapper') closeModal();
        });

        // 左右滑动
        let touchStartX = 0;
        modal.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
        modal.addEventListener('touchend', e => {
            let diff = e.changedTouches[0].screenX - touchStartX;
            if (diff < -50) {
                currentModalIndex = (currentModalIndex + 1) % photoUrls.length;
                modalImg.src = photoUrls[currentModalIndex].replace('/yl/', '/zp/');
            } else if (diff > 50) {
                currentModalIndex = (currentModalIndex - 1 + photoUrls.length) % photoUrls.length;
                modalImg.src = photoUrls[currentModalIndex].replace('/yl/', '/zp/');
            }
        }, {passive: true});

        // 全屏按钮绑定事件
        const fullscreenTip = document.getElementById('fullscreen-tip');
        const enterBtn = document.getElementById('enter-btn');
        const musicBtn = document.getElementById('music-btn');
        const bgm = document.getElementById('bgm');
        let isMusicPlaying = false;

        function unlockExperience(e) {
            e.preventDefault();
            e.stopPropagation();

            fullscreenTip.style.opacity = '0';
            setTimeout(() => fullscreenTip.remove(), 500);

            const docEl = document.documentElement;
            const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFS) {
                requestFS.call(docEl).catch(err => console.log("Fullscreen denied:", err));
            }

            if (!isMusicPlaying) {
                bgm.volume = 0.25;
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.classList.add('playing');
                }).catch(err => console.log("Audio play error:", err));
            }
        }

        enterBtn.addEventListener('click', unlockExperience);
        enterBtn.addEventListener('touchend', unlockExperience);

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
                musicBtn.classList.remove('playing');
            } else {
                bgm.volume = 0.25;
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.classList.add('playing');
                });
            }
        });

        // 彩蛋双指爱心
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                for (let i = 0; i < 25; i++) {
                    particles.push({
                        x: window.innerWidth / 2, y: window.innerHeight / 2,
                        size: Math.random() * 8 + 6,
                        speedX: (Math.random() - 0.5) * 6,
                        speedY: (Math.random() - 0.5) * 6 - 2,
                        opacity: 1, color: Math.random() > 0.5 ? '#ffb6c1' : '#ff69b4',
                        life: Math.random() * 40 + 40
                    });
                }
                if (isMusicPlaying) {
                    bgm.volume = 0.4;
                    setTimeout(() => { if (isMusicPlaying) bgm.volume = 0.25; }, 3000);
                }
            }
        });

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.speedX; p.y += p.speedY; p.opacity -= 1 / p.life;
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.fillStyle = p.color;
                ctx.font = `${p.size}px sans-serif`;
                ctx.fillText('❤', p.x, p.y);
                ctx.restore();
                if (p.opacity <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>

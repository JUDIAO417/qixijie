<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七夕相册管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c2436 0%, #4b3858 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #ffccd5;
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 16px;
            flex: 1;
            min-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .panel h3 {
            font-size: 16px;
            color: #ffccd5;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-list {
            flex: 1;
            max-height: 220px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .file-item span.status-green {
            color: #7ef9ff;
            font-weight: 500;
        }

        .file-item span.status-red {
            color: #ff758c;
            font-weight: 500;
        }

        .file-item a {
            color: #ff7eb3;
            text-decoration: none;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .file-box {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.3s;
        }

        .file-box:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .file-box input {
            display: none;
        }

        .file-box p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .upload-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4);
            transition: opacity 0.3s;
        }

        .upload-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .music-btn-style {
            background: linear-gradient(135deg, #7ef9ff 0%, #60a5fa 100%);
            color: #1e1b2e;
            font-weight: 600;
        }

        .status {
            font-size: 12px;
            color: #ffccd5;
            margin-top: 10px;
            text-align: center;
            min-height: 18px;
        }

        /* 修复后的弹窗查看层 */
        #preview-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #preview-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        #preview-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            display: none;
        }

        #preview-audio {
            display: none;
            margin-top: 20px;
            outline: none;
        }

        #preview-loading {
            color: #ffccd5;
            font-size: 16px;
            letter-spacing: 2px;
            display: none;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>✨ 七夕相册管理后台 ✨</h2>
        <p>状态指引：<span style="color: #7ef9ff;">绿色=已有压缩预览</span> ｜ <span style="color: #ff758c;">红色=缺少压缩预览</span></p>
    </div>

    <!-- 第一行：zp 与 yl 文件夹状态监测 -->
    <div class="main-container">
        <div class="panel" style="flex: 2; min-width: 380px;">
            <h3>
                📁 (原图) 
                <span id="zp-count" style="font-size: 12px; color: rgba(255,255,255,0.5);">加载中...</span>
            </h3>
            <div class="file-list" id="zp-list">
                <div class="file-item"><span>正在检测目录状态...</span></div>
            </div>
        </div>

        <div class="panel" style="flex: 1;">
            <h3>
                📂 (预览图) 
                <span id="yl-count" style="font-size: 12px; color: rgba(255,255,255,0.5);">加载中...</span>
            </h3>
            <div class="file-list" id="yl-list">
                <div class="file-item"><span>正在获取...</span></div>
            </div>
        </div>
    </div>

    <!-- 第二行：批量照片上传面板 -->
    <div class="main-container">
        <div class="panel" style="max-width: 100%; width: 100%;">
            <h3>🚀 上传</h3>
            <div class="file-box" onclick="document.getElementById('photoInput').click()">
                <p id="tip-text">📁 点击选择要上传的高清照片 (支持多选，自动同步原图与压缩图)</p>
                <input type="file" id="photoInput" accept="image/*" multiple onchange="handleSelect(this)">
            </div>
            <button class="upload-btn" id="submitBtn" onclick="uploadPhotos()" disabled>一键智能上传照片</button>
        </div>
    </div>

    <!-- 第三行：背景音乐管理模块 -->
    <div class="main-container">
        <div class="panel" style="max-width: 100%; width: 100%;">
            <h3>
                🎵 背景音乐管理 
                <span id="music-count" style="font-size: 12px; color: rgba(255,255,255,0.5);">检查中...</span>
            </h3>
            <div class="file-list" id="yy-list" style="max-height: 90px; margin-bottom: 12px;">
                <div class="file-item"><span>正在读取音乐目录...</span></div>
            </div>
            <div class="file-box" onclick="document.getElementById('musicInput').click()" style="margin-bottom: 10px;">
                <p id="music-tip-text">🎵 点击选择新的背景音乐</p>
                <input type="file" id="musicInput" accept="audio/*" onchange="handleMusicSelect(this)">
            </div>
            <button class="upload-btn music-btn-style" id="musicSubmitBtn" onclick="uploadMusic()" disabled>智能替换/上传背景音乐</button>
        </div>
    </div>

    <div class="status" id="global-status"></div>

    <!-- 终极底层的 Base64 数据还原弹窗 -->
    <div id="preview-modal" onclick="closePreview(event)">
        <div id="preview-loading">📡 加载美照中...</div>
        <img id="preview-img" src="" alt="Preview">
        <audio id="preview-audio" controls></audio>
        <p style="color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 15px; pointer-events: none;">点击黑色空白处关闭</p>
    </div>

    <script>
        const GITHUB_USER = "JUDIAO417";
        const REPO_NAME = "qixijie";
        const GITHUB_TOKEN = "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";

        let selectedFiles = [];
        let selectedMusicFile = null;
        let zpFilesData = [];
        let ylFilesData = [];
        let yyFilesData = [];

        window.onload = function() {
            refreshAllData();
        };

        // 终极必杀：通过 API 获取底层 Base64 数据并渲染，彻底无视 404 拦截
        async function fetchAndPreviewFile(apiUrl, type) {
            const modal = document.getElementById('preview-modal');
            const img = document.getElementById('preview-img');
            const audio = document.getElementById('preview-audio');
            const loading = document.getElementById('preview-loading');

            // 初始化界面状态
            img.style.display = 'none';
            audio.style.display = 'none';
            audio.pause();
            img.src = '';
            audio.src = '';
            loading.style.display = 'block';
            modal.classList.add('active');

            try {
                // 带 Token 请求 API 获取文件详细数据
                const res = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.encoding === 'base64') {
                        // 拼接出完美的数据链接
                        let mimeType = type === 'audio' ? 'audio/mp3' : 'image/jpeg';
                        let base64Url = `data:${mimeType};base64,${data.content.replace(/\n/g, '')}`;
                        
                        loading.style.display = 'none';
                        
                        if (type === 'image') {
                            img.src = base64Url;
                            img.style.display = 'block';
                        } else if (type === 'audio') {
                            audio.src = base64Url;
                            audio.style.display = 'block';
                            audio.play();
                        }
                    }
                } else {
                    alert("数据拉取被拒绝或文件不存在！");
                    modal.classList.remove('active');
                }
            } catch (e) {
                alert("网络连接异常！");
                modal.classList.remove('active');
            }
        }

        // 关闭弹窗
        function closePreview(e) {
            if (e.target.id === 'preview-modal') {
                document.getElementById('preview-modal').classList.remove('active');
                document.getElementById('preview-audio').pause();
            }
        }

        async function refreshAllData() {
            await Promise.all([loadZpFolder(), loadYlFolder(), loadYyFolder()]);
            renderZpList();
        }

        async function loadZpFolder() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/zp`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (res.ok) {
                    zpFilesData = await res.json();
                    document.getElementById('zp-count').innerText = `共 ${zpFilesData.length} 个`;
                } else {
                    zpFilesData = [];
                    document.getElementById('zp-count').innerText = `暂无目录`;
                }
            } catch (e) { zpFilesData = []; }
        }

        async function loadYlFolder() {
            const listEl = document.getElementById('yl-list');
            const countEl = document.getElementById('yl-count');
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/yl`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (res.ok) {
                    ylFilesData = await res.json();
                    countEl.innerText = `共 ${ylFilesData.length} 个`;
                    listEl.innerHTML = '';
                    if (ylFilesData.length === 0) {
                        listEl.innerHTML = `<div class="file-item"><span>为空</span></div>`;
                        return;
                    }
                    ylFilesData.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'file-item';
                        // 传入 API 的 url 给弹窗解析
                        div.innerHTML = `<span>${item.name}</span> <a onclick="fetchAndPreviewFile('${item.url}', 'image')">查看</a>`;
                        listEl.appendChild(div);
                    });
                } else {
                    ylFilesData = [];
                    countEl.innerText = `暂无目录`;
                    listEl.innerHTML = `<div class="file-item"><span>目录为空</span></div>`;
                }
            } catch (e) { ylFilesData = []; }
        }

        async function loadYyFolder() {
            const listEl = document.getElementById('yy-list');
            const countEl = document.getElementById('music-count');
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/yy`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (res.ok) {
                    yyFilesData = await res.json();
                    countEl.innerText = `共 ${yyFilesData.length} 个文件`;
                    listEl.innerHTML = '';
                    if (yyFilesData.length === 0) {
                        listEl.innerHTML = `<div class="file-item"><span>目录为空（未上传音乐）</span></div>`;
                        return;
                    }
                    yyFilesData.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'file-item';
                        // 传入 API 的 url 给弹窗解析试听
                        div.innerHTML = `<span style="color: #7ef9ff;">🎵 ${item.name}</span> <a onclick="fetchAndPreviewFile('${item.url}', 'audio')">试听</a>`;
                        listEl.appendChild(div);
                    });
                } else {
                    yyFilesData = [];
                    countEl.innerText = `暂无目录`;
                    listEl.innerHTML = `<div class="file-item"><span>目录为空</span></div>`;
                }
            } catch (e) { yyFilesData = []; }
        }

        function renderZpList() {
            const listEl = document.getElementById('zp-list');
            listEl.innerHTML = '';

            if (zpFilesData.length === 0) {
                listEl.innerHTML = `<div class="file-item"><span>zp 目录为空</span></div>`;
                return;
            }

            const ylFileNames = new Set(ylFilesData.map(item => item.name));

            zpFilesData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'file-item';

                const hasPreview = ylFileNames.has(item.name);
                const statusClass = hasPreview ? 'status-green' : 'status-red';
                const statusText = hasPreview ? `${item.name} (已有预览)` : `${item.name} (缺少预览)`;
                
                // 传入 API 的 url 给弹窗解析
                div.innerHTML = `<span class="${statusClass}">${statusText}</span> <a onclick="fetchAndPreviewFile('${item.url}', 'image')">原图</a>`;
                listEl.appendChild(div);
            });
        }

        function handleSelect(input) {
            selectedFiles = Array.from(input.files);
            if (selectedFiles.length > 0) {
                document.getElementById('tip-text').innerText = `已选择 ${selectedFiles.length} 张照片，准备就绪！`;
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function handleMusicSelect(input) {
            if (input.files && input.files[0]) {
                selectedMusicFile = input.files[0];
                document.getElementById('music-tip-text').innerText = `已选择新音乐：${selectedMusicFile.name}`;
                document.getElementById('musicSubmitBtn').disabled = false;
            }
        }

        async function uploadMusic() {
            const statusDiv = document.getElementById('global-status');
            const btn = document.getElementById('musicSubmitBtn');
            if (!selectedMusicFile) return;

            btn.disabled = true;
            statusDiv.innerText = "🎵 正在准备同步背景音乐...";

            try {
                if (yyFilesData && yyFilesData.length > 0) {
                    for (let oldFile of yyFilesData) {
                        statusDiv.innerText = `🧹 正在清理旧音乐：${oldFile.name}...`;
                        await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${oldFile.path}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `Remove old bgm: ${oldFile.name}`,
                                sha: oldFile.sha
                            })
                        });
                    }
                }

                statusDiv.innerText = "🚀 正在上传新背景音乐 (bgm.mp3)...";
                let base64Data = await toBase64(selectedMusicFile);
                let content = base64Data.split(',')[1];

                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/yy/bgm.mp3`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Update bgm.mp3",
                        content: content
                    })
                });

                if (!res.ok) throw new Error((await res.json()).message);

                statusDiv.innerText = "🎉 背景音乐更新成功，目录已自动保持单文件最新状态！";
                selectedMusicFile = null;
                document.getElementById('music-tip-text').innerText = "🎵 点击选择新的背景音乐 (将自动命名并覆盖旧音乐)";
                refreshAllData();
                setTimeout(() => { btn.disabled = false; }, 2000);

            } catch (err) {
                statusDiv.innerText = "❌ 音乐更新失败: " + err.message;
                btn.disabled = false;
            }
        }

        function compressImage(file, maxWidth = 450, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function uploadPhotos() {
            const statusDiv = document.getElementById('global-status');
            const btn = document.getElementById('submitBtn');
            if (selectedFiles.length === 0) return;

            btn.disabled = true;
            statusDiv.innerText = "🔍 正在检测编号...";

            try {
                let nextIndex = 1;
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/zp`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    let maxNum = 0;
                    data.forEach(item => {
                        let m = item.name.match(/^(\d+)\.(jpg|jpeg|png|webp)$/i);
                        if (m) { let n = parseInt(m[1]); if (n > maxNum) maxNum = n; }
                    });
                    nextIndex = maxNum + 1;
                }

                for (let i = 0; i < selectedFiles.length; i++) {
                    let file = selectedFiles[i];
                    let fileName = `${nextIndex + i}.jpg`;
                    statusDiv.innerText = `📦 正在处理第 ${i+1}/${selectedFiles.length} 张 (${fileName})...`;

                    let originalBase64 = await toBase64(file);
                    let originalContent = originalBase64.split(',')[1];

                    let compressedDataUrl = await compressImage(file, 450, 0.75);
                    let compressedContent = compressedDataUrl.split(',')[1];

                    statusDiv.innerText = `🚀 正在上传原图 zp/${fileName}...`;
                    let resZp = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/zp/${fileName}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Add original ${fileName}`, content: originalContent })
                    });
                    if (!resZp.ok) throw new Error("zp 上传失败");

                    statusDiv.innerText = `✨ 正在上传压缩图 yl/${fileName}...`;
                    let resYl = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/yl/${fileName}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Add compressed ${fileName}`, content: compressedContent })
                    });
                    if (!resYl.ok) throw new Error("yl 上传失败");
                }

                statusDiv.innerText = "🎉 所有照片原图与预览图同步上传成功！";
                selectedFiles = [];
                document.getElementById('tip-text').innerText = "📁 点击选择要上传的高清照片";
                refreshAllData();
                setTimeout(() => { btn.disabled = false; }, 2000);

            } catch (err) {
                statusDiv.innerText = "❌ 错误: " + err.message;
                btn.disabled = false;
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = err => reject(err);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 管理与上传后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c2436 0%, #4b3858 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #ffccd5;
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .panel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 16px;
            flex: 1;
            min-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .panel h3 {
            font-size: 16px;
            color: #ffccd5;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 列表展示区 */
        .file-list {
            flex: 1;
            max-height: 220px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .file-item span {
            color: rgba(255, 255, 255, 0.8);
            word-break: break-all;
        }

        .file-item a {
            color: #ff7eb3;
            text-decoration: none;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .file-item a:hover {
            background: rgba(255, 126, 179, 0.2);
        }

        /* 上传控件 */
        .file-box {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.3s;
        }

        .file-box:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .file-box input {
            display: none;
        }

        .file-box p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .upload-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4);
            transition: opacity 0.3s;
        }

        .upload-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            color: #ffccd5;
            margin-top: 10px;
            text-align: center;
            min-height: 18px;
        }

        /* 大图查看弹窗 */
        #preview-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #preview-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        #preview-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>✨ 七夕相册管理后台 ✨</h2>
        <p>当前仓库：JUDIAO417 / qixijie</p>
    </div>

    <div class="main-container">
        <!-- 左侧：zp 文件夹（照片管理） -->
        <div class="panel">
            <h3>📁 (照片) <span id="zp-count" style="font-size: 12px; color: rgba(255,255,255,0.5);">加载中...</span></h3>
            <div class="file-list" id="zp-list">
                <div class="file-item"><span>正在获取远程文件...</span></div>
            </div>

            <div class="file-box" onclick="document.getElementById('zpInput').click()">
                <p id="zp-tip">📁 点击选择要上传的照片 (支持多选)</p>
                <input type="file" id="zpInput" accept="image/*" multiple onchange="handleZpSelect(this)">
            </div>
            <button class="upload-btn" id="zpBtn" onclick="uploadPhotos()" disabled>上传</button>
            <div class="status" id="zp-status"></div>
        </div>

        <!-- 右侧：yy 文件夹（音乐管理） -->
        <div class="panel">
            <h3>🎵 (背景音乐) <span id="yy-count" style="font-size: 12px; color: rgba(255,255,255,0.5);">加载中...</span></h3>
            <div class="file-list" id="yy-list">
                <div class="file-item"><span>正在获取远程文件...</span></div>
            </div>

            <div class="file-box" onclick="document.getElementById('yyInput').click()">
                <p id="yy-tip">🎵 点击选择背景音乐 (bgm.mp3)</p>
                <input type="file" id="yyInput" accept="audio/mp3,audio/*" onchange="handleYySelect(this)">
            </div>
            <button class="upload-btn" id="yyBtn" onclick="uploadMusic()" disabled>上传/替换 bgm.mp3</button>
            <div class="status" id="yy-status"></div>
        </div>
    </div>

    <!-- 查看大图弹窗 -->
    <div id="preview-modal" onclick="this.classList.remove('active')">
        <img id="preview-img" src="" alt="Preview">
    </div>

    <script>
        // 写死的配置信息
        const GITHUB_USER = "JUDIAO417";
        const REPO_NAME = "qixijie";
        const GITHUB_TOKEN = "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";

        let selectedZpFiles = [];
        let selectedYyFile = null;
        let zpFilesData = [];

        // 页面加载完成后自动获取两边文件夹的内容
        window.onload = function() {
            loadFolderContent('zp', 'zp-list', 'zp-count');
            loadFolderContent('yy', 'yy-list', 'yy-count');
        };

        // 从 GitHub 获取指定文件夹内容
        async function loadFolderContent(folderName, listId, countId) {
            const listEl = document.getElementById(listId);
            const countEl = document.getElementById(countId);
            
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${folderName}`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    listEl.innerHTML = '';
                    countEl.innerText = `共 ${data.length} 个文件`;

                    if (data.length === 0) {
                        listEl.innerHTML = `<div class="file-item"><span>文件夹为空</span></div>`;
                        return;
                    }

                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'file-item';
                        
                        let actionHtml = '';
                        if (folderName === 'zp') {
                            actionHtml = `<a href="javascript:void(0)" onclick="previewImage('${item.download_url}')">查看</a>`;
                        } else {
                            actionHtml = `<a href="${item.download_url}" target="_blank">下载</a>`;
                        }

                        div.innerHTML = `<span>${item.name}</span> ${actionHtml}`;
                        listEl.appendChild(div);

                        if (folderName === 'zp') {
                            zpFilesData = data;
                        }
                    });
                } else {
                    countEl.innerText = `状态：目录可能不存在`;
                    listEl.innerHTML = `<div class="file-item"><span>目录暂未创建或为空</span></div>`;
                }
            } catch (err) {
                countEl.innerText = `加载失败`;
                listEl.innerHTML = `<div class="file-item"><span>网络异常</span></div>`;
            }
        }

        // 预览照片
        function previewImage(url) {
            const modal = document.getElementById('preview-modal');
            const img = document.getElementById('preview-img');
            img.src = url;
            modal.classList.add('active');
        }

        // 选择照片
        function handleZpSelect(input) {
            selectedZpFiles = Array.from(input.files);
            if (selectedZpFiles.length > 0) {
                document.getElementById('zp-tip').innerText = `已选择 ${selectedZpFiles.length} 张照片`;
                document.getElementById('zpBtn').disabled = false;
            }
        }

        // 选择音乐
        function handleYySelect(input) {
            if (input.files.length > 0) {
                selectedYyFile = input.files[0];
                document.getElementById('yy-tip').innerText = `已选择: ${selectedYyFile.name}`;
                document.getElementById('yyBtn').disabled = false;
            }
        }

        // 智能续号上传照片到 zp
        async function uploadPhotos() {
            const statusDiv = document.getElementById('zp-status');
            const submitBtn = document.getElementById('zpBtn');
            if (selectedZpFiles.length === 0) return;

            submitBtn.disabled = true;
            statusDiv.innerText = "🔍 正在检测 zp 目录编号...";

            try {
                let nextIndex = 1;
                const contentsUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/zp`;
                const res = await fetch(contentsUrl, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    let maxNum = 0;
                    data.forEach(item => {
                        let match = item.name.match(/^(\d+)\.(jpg|jpeg|png|webp)$/i);
                        if (match) {
                            let num = parseInt(match[1]);
                            if (num > maxNum) maxNum = num;
                        }
                    });
                    nextIndex = maxNum + 1;
                }

                statusDiv.innerText = `✨ 从编号 ${nextIndex}.jpg 开始连续上传...`;

                for (let i = 0; i < selectedZpFiles.length; i++) {
                    let file = selectedZpFiles[i];
                    let fileName = `${nextIndex + i}.jpg`;
                    let path = `zp/${fileName}`;
                    
                    statusDiv.innerText = `🚀 正在上传第 ${i+1}/${selectedZpFiles.length} 张 (${fileName})...`;

                    let base64Content = await toBase64(file);
                    let contentData = base64Content.split(',')[1];

                    let uploadRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Upload photo ${fileName} via manager`,
                            content: contentData
                        })
                    });

                    if (!uploadRes.ok) throw new Error((await uploadRes.json()).message);
                }

                statusDiv.innerText = "🎉 照片上传成功！刷新列表即可查看。";
                selectedZpFiles = [];
                document.getElementById('zp-tip').innerText = "📁 点击选择要上传的照片 (支持多选)";
                loadFolderContent('zp', 'zp-list', 'zp-count');
                setTimeout(() => { submitBtn.disabled = false; }, 2000);

            } catch (err) {
                statusDiv.innerText = "❌ 错误: " + err.message;
                submitBtn.disabled = false;
            }
        }

        // 上传背景音乐到 yy
        async function uploadMusic() {
            const statusDiv = document.getElementById('yy-status');
            const submitBtn = document.getElementById('yyBtn');
            if (!selectedYyFile) return;

            submitBtn.disabled = true;
            statusDiv.innerText = "🎵 正在准备上传音乐...";

            try {
                const path = `yy/bgm.mp3`; // 强制命名为 bgm.mp3
                
                // 先检查 yy/bgm.mp3 是否已存在（如果存在获取其 sha 以便覆盖更新）
                let sha = null;
                const checkRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (checkRes.ok) {
                    let fileData = await checkRes.json();
                    sha = fileData.sha;
                }

                statusDiv.innerText = "🚀 正在写入 bgm.mp3 到仓库...";

                let base64Content = await toBase64(selectedYyFile);
                let contentData = base64Content.split(',')[1];

                let bodyData = {
                    message: `Update background music bgm.mp3`,
                    content: contentData
                };
                if (sha) bodyData.sha = sha; // 存在则覆盖

                let uploadRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!uploadRes.ok) throw new Error((await uploadRes.json()).message);

                statusDiv.innerText = "🎉 音乐 bgm.mp3 上传/更新成功！";
                selectedYyFile = null;
                document.getElementById('yy-tip').innerText = "🎵 点击选择背景音乐 (bgm.mp3)";
                loadFolderContent('yy', 'yy-list', 'yy-count');
                setTimeout(() => { submitBtn.disabled = false; }, 2000);

            } catch (err) {
                statusDiv.innerText = "❌ 错误: " + err.message;
                submitBtn.disabled = false;
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
